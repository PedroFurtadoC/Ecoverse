name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# O build só lê o código. Sem isso o token do workflow herda permissão de escrita.
permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Tamanho do bundle
        run: |
          echo "=== dist ==="
          du -sh dist/
          echo "=== assets ==="
          ls -lh dist/assets/
